<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Near-Earth Asteroid Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060f; --panel:rgba(9,12,24,0.72); --panel-solid:rgba(7,9,19,0.96);
    --line:rgba(255,255,255,0.12); --line-soft:rgba(255,255,255,0.06);
    --ink:#eef1f8; --dim:rgba(238,241,248,0.55); --faint:rgba(238,241,248,0.34);
    --amber:#ffc861; --cyan:#6fd3ff; --coral:#ff6b6b;
    --shadow:0 18px 50px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);font-family:"Space Mono",monospace;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;}

  #loading{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;}
  #loading .title{font-family:"Instrument Serif",serif;font-size:32px;letter-spacing:0.02em;font-style:italic;}
  #loadBar{width:240px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
  #loadFill{height:100%;width:0%;background:var(--cyan);transition:width 0.35s ease;}
  #loadMsg{font-size:10.5px;color:var(--faint);letter-spacing:0.14em;text-transform:uppercase;}

  #app{position:fixed;inset:0;display:none;}
  canvas#c{display:block;width:100%;height:100%;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);}

  /* title — flush top-left */
  #title{position:absolute;top:24px;left:24px;font-family:"Instrument Serif",serif;font-weight:400;
    font-size:27px;line-height:1.05;letter-spacing:0.01em;pointer-events:none;
    opacity:0;animation:fade 0.9s 0.2s forwards;}
  #title em{font-style:italic;color:var(--cyan);}

  /* search / filter — flush top-right */
  #finder{position:absolute;top:24px;right:24px;width:248px;display:flex;flex-direction:column;gap:9px;
    opacity:0;animation:fade 0.9s 0.35s forwards;}
  #searchBox{display:flex;align-items:center;gap:9px;padding:9px 13px;}
  #searchBox svg{flex-shrink:0;opacity:0.5;}
  #search{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:"Space Mono",monospace;font-size:12px;}
  #search::placeholder{color:var(--faint);}
  #results{max-height:240px;overflow-y:auto;padding:5px;display:none;}
  #results.show{display:block;}
  .res{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:11.5px;display:flex;justify-content:space-between;gap:10px;}
  .res:hover{background:rgba(255,255,255,0.06);}
  .res .nm{color:var(--ink);}
  .res .meta{color:var(--faint);font-size:10px;white-space:nowrap;}
  .res .meta.haz{color:var(--coral);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:10px;letter-spacing:0.04em;padding:6px 10px;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,0.03);color:var(--faint);cursor:pointer;transition:all 0.18s;}
  .chip:hover{color:var(--ink);}
  .chip.on{color:var(--amber);border-color:var(--amber);background:rgba(255,200,97,0.1);}

  /* view buttons — flush, below finder */
  #viewBtns{position:absolute;top:118px;right:24px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;
    opacity:0;animation:fade 0.9s 0.45s forwards;}
  .vbtn{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
    background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:7px 12px;cursor:pointer;
    transition:all 0.2s;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .vbtn:hover{border-color:var(--cyan);color:var(--ink);}
  .vbtn.on{border-color:var(--amber);color:var(--amber);}

  /* selected-asteroid card — flush bottom-left */
  #card{position:absolute;left:24px;bottom:24px;width:266px;padding:17px 19px;z-index:30;
    transform:translateY(14px);opacity:0;pointer-events:none;transition:opacity 0.4s,transform 0.4s cubic-bezier(0.22,1,0.36,1);}
  #card.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  #card .nm{font-family:"Instrument Serif",serif;font-size:25px;line-height:1.05;}
  #card .badge{display:inline-block;font-size:8.5px;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;letter-spacing:0.05em;}
  #card .cls{font-size:10px;color:var(--faint);letter-spacing:0.04em;margin:3px 0 14px;}
  #card .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;}
  #card .k{font-size:8px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);margin-bottom:3px;}
  #card .v{font-size:15px;line-height:1;} #card .v small{font-size:10px;color:var(--dim);}
  #card .miss{grid-column:1/3;padding-top:11px;border-top:1px solid var(--line-soft);}
  #card .miss .v{font-size:22px;color:var(--coral);} #card.safe .miss .v{color:var(--cyan);}
  #card .close{position:absolute;top:13px;right:14px;background:none;border:none;color:var(--faint);font-size:15px;cursor:pointer;line-height:1;}
  #card .close:hover{color:var(--ink);}

  /* time console — flush bottom-center */
  #console{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,calc(100vw - 360px));
    min-width:380px;padding:15px 20px 16px;opacity:0;animation:fade 0.9s 0.5s forwards;}
  #ctop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:11px;}
  #bigDate{font-family:"Instrument Serif",serif;font-size:34px;line-height:0.95;letter-spacing:0.015em;}
  #bigDate .yr{color:var(--amber);}
  #status{font-size:10px;color:var(--faint);margin-top:3px;min-height:13px;letter-spacing:0.04em;}
  #status .hot{color:var(--cyan);}
  #rateVal{font-size:13px;color:var(--cyan);text-align:right;}
  #scrub{position:relative;height:30px;margin:2px 0 11px;cursor:pointer;}
  #track{position:absolute;left:0;right:0;top:13px;height:3px;background:rgba(255,255,255,0.1);border-radius:3px;}
  #trackFill{position:absolute;left:0;top:0;height:100%;background:var(--cyan);opacity:0.55;border-radius:3px;width:0;}
  #handle{position:absolute;top:7px;width:4px;height:15px;border-radius:3px;background:var(--ink);
    box-shadow:0 0 9px rgba(255,255,255,0.6);transform:translateX(-50%);pointer-events:none;}
  .yrlabel{position:absolute;top:21px;font-size:8px;color:var(--faint);transform:translateX(-50%);}
  #selTick{position:absolute;top:3px;width:2px;height:23px;border-radius:2px;background:var(--amber);
    box-shadow:0 0 10px var(--amber);transform:translateX(-50%);display:none;}
  #selTick::after{content:'closest';position:absolute;bottom:25px;left:50%;transform:translateX(-50%);
    font-size:8px;color:var(--amber);white-space:nowrap;}
  #transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tbtn{font-family:"Space Mono",monospace;background:rgba(255,255,255,0.04);border:1px solid var(--line);
    color:var(--dim);border-radius:9px;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;}
  .tbtn:hover{border-color:var(--cyan);color:var(--ink);}
  .tbtn.icon{width:36px;height:32px;font-size:12px;}
  #playBtn{width:44px;height:32px;font-size:13px;background:rgba(111,211,255,0.08);color:var(--cyan);border-color:var(--line);}
  #playBtn:hover{background:rgba(111,211,255,0.16);}
  .tbtn.on{border-color:var(--amber);color:var(--amber);background:rgba(255,200,97,0.08);}
  .sep{width:1px;height:20px;background:var(--line-soft);margin:0 2px;}
  .speeds{display:flex;gap:5px;}
  .spd{font-size:9.5px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,0.03);color:var(--faint);cursor:pointer;transition:all 0.18s;}
  .spd:hover{color:var(--ink);} .spd.on{color:var(--amber);border-color:var(--amber);background:rgba(255,200,97,0.1);}

  #tip{position:absolute;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line);
    border-radius:9px;padding:7px 11px;font-size:11px;display:none;max-width:200px;z-index:40;}
  #tip .s{color:var(--dim);font-size:10px;}

  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  #title{transform:none;} /* let fade handle it */
  @media (max-width:760px){#card{display:none;}#finder{width:200px;}#console{min-width:300px;width:calc(100vw - 40px);}}
</style>
</head>
<body>

<div id="loading">
  <div class="title">Near-Earth Asteroid Survey</div>
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="loadMsg">Initializing…</div>
</div>

<div id="app">
  <canvas id="c"></canvas>

  <h1 id="title">Near-Earth <em>Asteroid</em> Survey</h1>

  <div id="finder">
    <div id="searchBox" class="panel">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" placeholder="Search asteroids…" autocomplete="off"/>
    </div>
    <div id="results" class="panel"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="viewBtns">
    <button class="vbtn" id="btnScale">Planets</button>
    <button class="vbtn" id="btnTop">Top-down</button>
    <button class="vbtn" id="btnReset">Reset</button>
  </div>

  <div id="card" class="panel"></div>

  <div id="console" class="panel">
    <div id="ctop">
      <div>
        <div id="bigDate">—</div>
        <div id="status"></div>
      </div>
      <div id="rateVal">1 mo / s</div>
    </div>
    <div id="scrub"><div id="track"><div id="trackFill"></div></div><div id="ticks"></div><div id="selTick"></div><div id="handle"></div></div>
    <div id="transport">
      <button class="tbtn" id="playBtn" title="Play / pause">▶</button>
      <button class="tbtn icon on" id="btnRev" title="Reverse">↺</button>
      <span class="sep"></span>
      <div class="speeds" id="speeds"></div>
    </div>
  </div>

  <div id="tip"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const loadFill=$('loadFill'),loadMsg=$('loadMsg');
  const setLoad=(p,m)=>{loadFill.style.width=p+'%';if(m)loadMsg.textContent=m;};

  // ── DATA ──────────────────────────────────────────────────────────────────
  setLoad(12,'Fetching orbital data…');
  let astData,caData,CA_BY_NAME;
  try{
    const [a,c]=await Promise.all([fetch('data/asteroids.json'),fetch('data/close_approaches.json')]);
    setLoad(42,'Parsing…'); astData=await a.json(); caData=await c.json();
  }catch(err){ loadMsg.textContent='Load error: '+err.message; return; }
  CA_BY_NAME={};
  for(const ca of caData.close_approaches){ (CA_BY_NAME[ca.name]||(CA_BY_NAME[ca.name]=[])).push(ca); }

  // ── TIME / ORBIT MATH ───────────────────────────────────────────────────────
  const DEG=Math.PI/180, AU=2.6, AU_TO_LD=389.17;
  const jdFromMs=ms=>ms/86400000+2440587.5, msFromJd=jd=>(jd-2440587.5)*86400000;
  const jdFromDateStr=s=>jdFromMs(Date.parse(s+'T00:00:00Z'));
  const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const fmtDate=jd=>{const d=new Date(msFromJd(jd));return `${String(d.getUTCDate()).padStart(2,'0')} ${MON[d.getUTCMonth()]} <span class="yr">${d.getUTCFullYear()}</span>`;};
  const START_JD=jdFromDateStr('2025-01-01'), END_JD=jdFromDateStr('2125-01-01');

  function prep(el){
    const i=el.inc*DEG,Om=el.node*DEG,om=el.peri*DEG;
    const cO=Math.cos(Om),sO=Math.sin(Om),co=Math.cos(om),so=Math.sin(om),cI=Math.cos(i),sI=Math.sin(i);
    el.b=el.a*Math.sqrt(1-el.e*el.e); el.ae=el.a*el.e;
    el.m00=cO*co-sO*so*cI; el.m01=-cO*so-sO*co*cI;
    el.m20=sO*co+cO*so*cI; el.m21=-sO*so+cO*co*cI;
    el.m10=so*sI;          el.m11=co*sI;
    return el;
  }
  function solveE(M,e){
    M=((M%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    let E=e<0.8?M:Math.PI;
    for(let k=0;k<8;k++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-6)break;}
    return E;
  }
  const _v=new THREE.Vector3();
  function posAt(el,jd,s){
    const M=(el.M0+el.n*(jd-el.epoch))*DEG, E=solveE(M,el.e);
    const xo=el.a*Math.cos(E)-el.ae, yo=el.b*Math.sin(E);
    return _v.set((el.m00*xo+el.m01*yo)*s,(el.m10*xo+el.m11*yo)*s,(el.m20*xo+el.m21*yo)*s);
  }

  // Earth — mean elements at J2000
  const EARTH=prep({a:1.00000,e:0.01671,inc:0.00005,node:0.0,peri:102.9377,M0:357.529,n:0.985608,epoch:2451545.0});
  const J2000=2451545.0;
  const PLANETS=[
    {name:'MERCURY',col:0x9a8f80,el:prep({a:0.38710,e:0.20563,inc:7.005,node:48.331,peri:29.124,M0:174.795,n:4.092339,epoch:J2000})},
    {name:'VENUS',  col:0xc9b58e,el:prep({a:0.72333,e:0.00677,inc:3.395,node:76.680,peri:54.884,M0:50.115,n:1.602136,epoch:J2000})},
    {name:'MARS',   col:0xc66b4a,el:prep({a:1.52371,e:0.09339,inc:1.850,node:49.558,peri:286.502,M0:19.373,n:0.524039,epoch:J2000})},
  ];

  // ── SELECT THE NEAR-EARTH SET ───────────────────────────────────────────────
  // Asteroids with a 2025-2125 Earth approach, closest first; cap for a clean field.
  setLoad(60,'Selecting near-Earth objects…');
  const MAX_SHOWN=200;
  const AST=[];
  for(const a of astData.asteroids){
    if(a.epoch==null||a.mean_motion==null||a.mean_anomaly==null) continue;
    const cas=(CA_BY_NAME[a.short_name]||[]).filter(c=>c.year>=2025&&c.year<=2125);
    if(!cas.length) continue;
    let best=cas[0]; for(const c of cas) if(c.miss_distance_ld<best.miss_distance_ld) best=c;
    const el=prep({a:a.semi_major_axis,e:a.eccentricity,inc:a.inclination,node:a.ascending_node_longitude,
      peri:a.perihelion_argument,M0:a.mean_anomaly,n:a.mean_motion,epoch:a.epoch,
      ref:a,event:best,eventJd:jdFromDateStr(best.date),haz:!!a.potentially_hazardous});
    AST.push(el);
  }
  AST.sort((x,y)=>x.event.miss_distance_ld-y.event.miss_distance_ld);
  if(AST.length>MAX_SHOWN) AST.length=MAX_SHOWN;
  AST.forEach((el,i)=>el.idx=i);

  setLoad(78,'Building scene…');

  // ── RENDERER / SCENE (no stars, no sun, no other planets) ───────────────────
  const canvas=$('c');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x04060f,1);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(46,1,0.001,400);
  function resize(){const W=innerWidth,H=innerHeight;renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();}
  resize(); addEventListener('resize',resize);
  scene.add(new THREE.AmbientLight(0xffffff,0.9));

  function glowTex(){
    const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;
    const ctx=cv.getContext('2d');const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(0.4,'rgba(255,255,255,0.18)');g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);
  }
  const softTex=glowTex();
  function labelSprite(text,color,size){
    const cv=document.createElement('canvas');cv.width=256;cv.height=64;const ctx=cv.getContext('2d');
    ctx.font='700 28px "Space Mono", monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=8;ctx.fillStyle=color;ctx.fillText(text,128,34);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false,depthTest:false}));
    sp.scale.set(size,size*0.25,1);sp.renderOrder=20;return sp;
  }

  // EARTH — the hero / reference
  const earthMesh=new THREE.Mesh(new THREE.SphereGeometry(0.085,40,40),
    new THREE.MeshStandardMaterial({color:0x3d7fc4,roughness:0.7,emissive:0x1b4a86,emissiveIntensity:0.5}));
  scene.add(earthMesh);
  const earthAtmo=new THREE.Mesh(new THREE.SphereGeometry(0.085*1.4,40,40),
    new THREE.MeshBasicMaterial({color:0x6fd3ff,transparent:true,opacity:0.18,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));
  earthMesh.add(earthAtmo);
  const earthGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex,color:0x8fd8ff,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false}));
  earthGlow.scale.setScalar(0.62);scene.add(earthGlow);
  const earthLabel=labelSprite('EARTH','#cfeeff',0.9);scene.add(earthLabel);

  // ── SCALE CONTEXT: subtle Sun anchor + inner-planet orbit rings ─────────────
  // Built in heliocentric coords; each frame the whole group is shifted by
  // −Earth so it swings around the fixed Earth, giving a sense of scale.
  function planetOrbit(el,color,op){
    const seg=180,arr=new Float32Array((seg+1)*3);
    for(let i=0;i<=seg;i++){const E=2*Math.PI*i/seg,xo=el.a*Math.cos(E)-el.ae,yo=el.b*Math.sin(E);
      arr[i*3]=(el.m00*xo+el.m01*yo)*AU;arr[i*3+1]=(el.m10*xo+el.m11*yo)*AU;arr[i*3+2]=(el.m20*xo+el.m21*yo)*AU;}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
    const line=new THREE.LineLoop(g,new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));
    line.frustumCulled=false;scene.add(line);return line;
  }
  const sunMarker=new THREE.Mesh(new THREE.SphereGeometry(0.06,18,18),new THREE.MeshBasicMaterial({color:0xe8c45a}));
  scene.add(sunMarker);
  const sunGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:softTex,color:0xffcf6b,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false}));
  sunGlow.scale.setScalar(0.42);scene.add(sunGlow);
  const sunLabel=labelSprite('SUN','rgba(255,207,107,0.65)',0.62);scene.add(sunLabel);
  const earthOrbit=planetOrbit(EARTH,0x6fd3ff,0.15);
  const planetVis=PLANETS.map(p=>{
    const orbit=planetOrbit(p.el,p.col,0.1);
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(0.04,16,16),new THREE.MeshBasicMaterial({color:p.col}));
    scene.add(mesh);
    const label=labelSprite(p.name,'rgba(255,255,255,0.45)',0.6);scene.add(label);
    return {el:p.el,orbit,mesh,label};
  });
  const scaleObjs=[sunMarker,sunGlow,sunLabel,earthOrbit,
    ...planetVis.flatMap(p=>[p.orbit,p.mesh,p.label])];
  let showScale=false;                       // planets hidden by default
  scaleObjs.forEach(o=>o.visible=false);

  // ── ASTEROIDS: dots + time-fading white comet trails ────────────────────────
  const HAZ_TINT=new THREE.Color(0xffb3a8), WHITE=new THREE.Color(0xdfe7f2), SEL_COL=new THREE.Color(0x9fe6ff);
  const TRAIL_K=46;            // samples per trail
  const TRAIL_MIN_STEP=0.4;    // min sim-days between samples

  // one Points object for all asteroid heads
  const dotPos=new Float32Array(AST.length*3), dotCol=new Float32Array(AST.length*3);
  const dotGeo=new THREE.BufferGeometry();
  dotGeo.setAttribute('position',new THREE.BufferAttribute(dotPos,3));
  dotGeo.setAttribute('color',new THREE.BufferAttribute(dotCol,3));
  const dots=new THREE.Points(dotGeo,new THREE.PointsMaterial({size:0.06,map:softTex,vertexColors:true,
    transparent:true,opacity:0.95,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
  scene.add(dots);

  // per-asteroid trail line
  AST.forEach(el=>{
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(TRAIL_K*3),3));
    g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(TRAIL_K*3),3));
    g.setDrawRange(0,0);
    const line=new THREE.Line(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.9,
      blending:THREE.AdditiveBlending,depthWrite:false}));
    line.frustumCulled=false; scene.add(line);
    el.line=line; el.samp=[]; el.lastSampJd=null; el.dim=false;
  });

  // selected highlight: a ring marker + connector line to Earth
  const selRing=new THREE.Mesh(new THREE.RingGeometry(0.08,0.1,40),
    new THREE.MeshBasicMaterial({color:0x6fd3ff,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  scene.add(selRing);
  const linkGeo=new THREE.BufferGeometry();linkGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
  const link=new THREE.Line(linkGeo,new THREE.LineBasicMaterial({color:0xffc861,transparent:true,opacity:0}));
  scene.add(link);

  setLoad(100,'Ready'); await new Promise(r=>setTimeout(r,240));
  $('loading').style.display='none'; $('app').style.display='block'; resize();

  // ════════════════════════════ TIME ENGINE ══════════════════════════════════
  const SPEEDS=[{l:'1d',v:1},{l:'1w',v:7},{l:'1mo',v:30},{l:'3mo',v:91},{l:'1yr',v:365}];
  let speedIdx=2,dir=1,playing=true,simJd=START_JD;
  let selected=null,following=false;

  const speedsEl=$('speeds');
  SPEEDS.forEach((s,i)=>{const b=document.createElement('button');b.className='spd'+(i===speedIdx?' on':'');
    b.textContent=s.l+'/s';b.onclick=()=>{speedIdx=i;[...speedsEl.children].forEach((c,j)=>c.classList.toggle('on',j===i));updateRate();};speedsEl.appendChild(b);});
  const updateRate=()=>$('rateVal').textContent=`${dir<0?'− ':''}${SPEEDS[speedIdx].l} / s`;
  updateRate();

  // timeline year labels
  [2025,2050,2075,2100,2125].forEach(y=>{const l=document.createElement('div');l.className='yrlabel';
    l.textContent=y;l.style.left=(((jdFromDateStr(y+'-01-01')-START_JD)/(END_JD-START_JD))*100)+'%';$('ticks').appendChild(l);});

  const playBtn=$('playBtn');
  const setPlaying=p=>{playing=p;playBtn.textContent=p?'❚❚':'▶';};
  playBtn.onclick=()=>setPlaying(!playing);
  $('btnRev').onclick=function(){dir=-dir;this.style.transform=dir<0?'scaleX(-1)':'none';updateRate();clearTrails();};

  function clearTrails(){ AST.forEach(el=>{el.samp.length=0;el.lastSampJd=null;el.line.geometry.setDrawRange(0,0);}); }

  // ── CAMERA (top-down default, follows Earth or selected) ────────────────────
  let theta=0.0, phi=0.12, zoomMul=1;            // phi small = top-down
  const DEFAULT_R=9;
  const camTarget=new THREE.Vector3();
  let actR=DEFAULT_R, desR=DEFAULT_R;
  function updateCamera(){
    camera.position.set(
      camTarget.x+actR*Math.sin(phi)*Math.sin(theta),
      camTarget.y+actR*Math.cos(phi),
      camTarget.z+actR*Math.sin(phi)*Math.cos(theta));
    camera.lookAt(camTarget);
  }
  const selTick=$('selTick');
  $('btnScale').onclick=function(){showScale=!showScale;this.classList.toggle('on',showScale);
    scaleObjs.forEach(o=>o.visible=showScale);};
  $('btnTop').onclick=()=>{phi=0.06;theta=0;};
  $('btnReset').onclick=()=>{phi=0.12;theta=0;zoomMul=1;deselect();};

  // ── SELECTION / FOLLOW ──────────────────────────────────────────────────────
  function showCard(el){
    const a=el.ref,ev=el.event;
    const km=ev.miss_distance_au*149597870.7;
    const kmStr=km>=1e6?(km/1e6).toFixed(2)+'M km':Math.round(km).toLocaleString()+' km';
    const dia=a.diameter_max_m>=1000?(a.diameter_max_m/1000).toFixed(2)+' km':Math.round(a.diameter_max_m)+' m';
    const card=$('card');card.classList.toggle('safe',!el.haz);
    card.innerHTML=
      `<button class="close" title="Deselect">✕</button>`+
      `<div class="nm">${a.short_name}<span class="badge" style="${el.haz?'background:rgba(255,107,107,.16);color:var(--coral)':'background:rgba(111,211,255,.14);color:var(--cyan)'}">${el.haz?'HAZARDOUS':'SAFE'}</span></div>`+
      `<div class="cls">${a.orbit_class_type} · closest pass ${ev.date}</div>`+
      `<div class="grid">`+
        `<div><div class="k">Velocity</div><div class="v">${ev.velocity_kms.toFixed(1)} <small>km/s</small></div></div>`+
        `<div><div class="k">Diameter</div><div class="v">${dia}</div></div>`+
        `<div><div class="k">Eccentricity</div><div class="v">${a.eccentricity.toFixed(3)}</div></div>`+
        `<div><div class="k">Inclination</div><div class="v">${a.inclination.toFixed(1)}<small>°</small></div></div>`+
        `<div class="miss"><div class="k">Closest miss distance</div><div class="v">${ev.miss_distance_ld.toFixed(2)} <small style="font-size:11px">LD · ${kmStr}</small></div></div>`+
      `</div>`;
    card.querySelector('.close').onclick=deselect;
    card.classList.add('show');
  }
  function selectAst(el,jumpTime){
    selected=el;following=true;
    AST.forEach(o=>o.dim=true); el.dim=false;
    if(jumpTime!==false){ simJd=el.eventJd; setPlaying(false); clearTrails(); $('status').innerHTML=`<span class="hot">◉ FOLLOWING</span> ${el.ref.short_name} — press play to track it`; }
    const tf=(el.eventJd-START_JD)/(END_JD-START_JD);
    selTick.style.left=(tf*100)+'%'; selTick.style.display='block';
    showCard(el);
    $('search').value=''; $('results').classList.remove('show');
  }
  function deselect(){
    selected=null;following=false;clearTrails();
    $('card').classList.remove('show');selRing.material.opacity=0;link.material.opacity=0;
    selTick.style.display='none';$('status').textContent='';
  }

  // ── SEARCH + FILTER ──────────────────────────────────────────────────────────
  let filter='all'; // all | hazardous | Apollo | Amor | Aten | Atira
  function matchFilter(el){
    if(filter==='all')return true;
    if(filter==='hazardous')return el.haz;
    return el.ref.orbit_class_type===filter;
  }
  function applyFilter(){
    AST.forEach(el=>{
      const m=matchFilter(el);
      el.hidden=!m; el.line.visible=m;
    });
    if(selected&&selected.hidden) deselect();
  }
  const chipsEl=$('chips');
  [['all','All'],['hazardous','Hazardous'],['Apollo','Apollo'],['Amor','Amor'],['Aten','Aten']].forEach(([v,lbl])=>{
    const b=document.createElement('button');b.className='chip'+(v==='all'?' on':'');b.textContent=lbl;
    b.onclick=()=>{filter=v;[...chipsEl.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');applyFilter();renderResults($('search').value);};
    chipsEl.appendChild(b);
  });

  const resultsEl=$('results');
  function renderResults(q){
    q=(q||'').trim().toLowerCase();
    let list=AST.filter(el=>matchFilter(el));
    if(q) list=list.filter(el=>el.ref.short_name.toLowerCase().includes(q)||el.ref.name.toLowerCase().includes(q));
    list=list.slice(0,9);
    if(!list.length){resultsEl.classList.remove('show');return;}
    resultsEl.innerHTML=list.map(el=>
      `<div class="res" data-i="${el.idx}"><span class="nm">${el.ref.short_name}</span>`+
      `<span class="meta ${el.haz?'haz':''}">${el.event.miss_distance_ld.toFixed(1)} LD · ${el.event.date.slice(0,4)}</span></div>`).join('');
    resultsEl.querySelectorAll('.res').forEach(r=>r.onclick=()=>selectAst(AST[+r.dataset.i],true));
    resultsEl.classList.add('show');
  }
  $('search').addEventListener('input',e=>renderResults(e.target.value));
  $('search').addEventListener('focus',e=>renderResults(e.target.value));
  document.addEventListener('click',e=>{if(!$('finder').contains(e.target))resultsEl.classList.remove('show');});

  // ── PICKING / ORBIT CONTROLS ─────────────────────────────────────────────────
  const ray=new THREE.Raycaster();ray.params.Points={threshold:0.13};
  const ndc=new THREE.Vector2();
  let dragging=false,lastX=0,lastY=0,moved=false;
  function pickDot(cx,cy){
    const r=canvas.getBoundingClientRect();
    ndc.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);
    const hits=ray.intersectObject(dots);
    for(const h of hits){const el=AST[h.index];if(el&&!el.hidden)return el;}
    return null;
  }
  let downOnCanvas=false;
  canvas.addEventListener('mousedown',e=>{dragging=true;downOnCanvas=true;lastX=e.clientX;lastY=e.clientY;moved=false;});
  addEventListener('mouseup',e=>{
    // only treat as a scene click if the press started on the canvas — clicking
    // UI (play/speed/etc.) must not deselect the followed asteroid.
    if(downOnCanvas&&!moved){const el=pickDot(e.clientX,e.clientY); if(el)selectAst(el,true); else deselect();}
    downOnCanvas=false;dragging=false;
  });
  addEventListener('mousemove',e=>{
    if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.abs(dx)>2||Math.abs(dy)>2)moved=true;
    theta-=dx*0.008;phi=Math.max(0.02,Math.min(Math.PI/2-0.02,phi+dy*0.008));
    lastX=e.clientX;lastY=e.clientY;
  });
  canvas.addEventListener('wheel',e=>{e.preventDefault();zoomMul=Math.max(0.18,Math.min(5,zoomMul*(e.deltaY>0?1.1:0.909)));},{passive:false});

  let pinch=0,tMoved=false;
  canvas.addEventListener('touchstart',e=>{
    if(e.touches.length===1){dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;tMoved=false;}
    if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();tMoved=true;
    if(e.touches.length===1&&dragging){const dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;
      theta-=dx*0.01;phi=Math.max(0.02,Math.min(Math.PI/2-0.02,phi+dy*0.01));lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
    if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(pinch>0)zoomMul=Math.max(0.18,Math.min(5,zoomMul*(pinch/d)));pinch=d;}
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    if(!tMoved&&e.changedTouches.length===1){const el=pickDot(e.changedTouches[0].clientX,e.changedTouches[0].clientY);if(el)selectAst(el,true);else deselect();}
    dragging=false;
  });

  const tip=$('tip');
  canvas.addEventListener('mousemove',e=>{
    if(dragging){tip.style.display='none';return;}
    const el=pickDot(e.clientX,e.clientY);
    if(el){tip.innerHTML=`<b>${el.ref.short_name}</b><br><span class="s">${el.ref.orbit_class_type} · closest ${el.event.miss_distance_ld.toFixed(2)} LD</span>`;
      tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-210)+'px';tip.style.top=(e.clientY-8)+'px';canvas.style.cursor='pointer';}
    else{tip.style.display='none';canvas.style.cursor='default';}
  });
  canvas.addEventListener('mouseleave',()=>tip.style.display='none');

  // scrubber
  const scrubEl=$('scrub');let scrubbing=false;
  function scrubTo(cx){const r=scrubEl.getBoundingClientRect();const f=Math.max(0,Math.min(1,(cx-r.left)/r.width));
    simJd=START_JD+f*(END_JD-START_JD);clearTrails();}
  scrubEl.addEventListener('mousedown',e=>{scrubbing=true;setPlaying(false);scrubTo(e.clientX);});
  addEventListener('mousemove',e=>{if(scrubbing)scrubTo(e.clientX);});
  addEventListener('mouseup',()=>scrubbing=false);
  scrubEl.addEventListener('touchstart',e=>{scrubbing=true;setPlaying(false);scrubTo(e.touches[0].clientX);},{passive:true});
  addEventListener('touchmove',e=>{if(scrubbing)scrubTo(e.touches[0].clientX);},{passive:true});
  addEventListener('touchend',()=>scrubbing=false);

  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}});

  // ════════════════════════════ MAIN LOOP (geocentric) ═══════════════════════
  // Everything is drawn in an Earth-centred frame: Earth is pinned at the origin
  // and never moves; each asteroid is positioned at (heliocentric − Earth), so
  // its trail traces its trajectory *relative to Earth*.
  const earthHelio=new THREE.Vector3(), astPos=new THREE.Vector3(), _sun=new THREE.Vector3(), _p=new THREE.Vector3();
  earthMesh.position.set(0,0,0); earthGlow.position.set(0,0,0); earthLabel.position.set(0,0.22,0);
  let last=performance.now();
  applyFilter();
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(0.05,(now-last)/1000);last=now;

    if(playing&&!scrubbing){
      simJd+=dir*SPEEDS[speedIdx].v*dt;
      if(simJd>=END_JD){simJd=END_JD;setPlaying(false);}
      if(simJd<=START_JD){simJd=START_JD;setPlaying(false);}
    }

    earthHelio.copy(posAt(EARTH,simJd,AU));   // frame origin (Earth's true position)
    earthMesh.rotation.y+=0.01;
    const advancing=playing&&!scrubbing;

    // scale context: shift the heliocentric solar system by −Earth so it sits
    // correctly around the fixed Earth at the origin.
    if(showScale){
      _sun.copy(earthHelio).multiplyScalar(-1);
      sunMarker.position.copy(_sun);sunGlow.position.copy(_sun);sunLabel.position.set(_sun.x,_sun.y+0.16,_sun.z);
      earthOrbit.position.copy(_sun);
      for(const p of planetVis){
        p.orbit.position.copy(_sun);
        _p.copy(posAt(p.el,simJd,AU)).sub(earthHelio);
        p.mesh.position.copy(_p);p.label.position.set(_p.x,_p.y+0.12,_p.z);
      }
    }

    for(const el of AST){
      const sel=(el===selected);
      // When an asteroid is selected, isolate it: hide every other asteroid so
      // only its trajectory relative to Earth is shown.
      if(el.hidden || (selected && !sel)){
        el.line.visible=false;dotCol[el.idx*3]=dotCol[el.idx*3+1]=dotCol[el.idx*3+2]=0;continue;
      }
      el.line.visible=true;
      astPos.copy(posAt(el,simJd,AU)).sub(earthHelio);   // Earth-relative position
      dotPos[el.idx*3]=astPos.x;dotPos[el.idx*3+1]=astPos.y;dotPos[el.idx*3+2]=astPos.z;
      const base=el.haz?HAZ_TINT:WHITE, tc=sel?SEL_COL:base;
      const b=sel?1.8:1.0;
      dotCol[el.idx*3]=Math.min(1,tc.r*b);dotCol[el.idx*3+1]=Math.min(1,tc.g*b);dotCol[el.idx*3+2]=Math.min(1,tc.b*b);

      if(advancing&&(el.lastSampJd===null||Math.abs(simJd-el.lastSampJd)>=TRAIL_MIN_STEP)){
        el.samp.push(astPos.x,astPos.y,astPos.z);
        if(el.samp.length>TRAIL_K*3)el.samp.splice(0,el.samp.length-TRAIL_K*3);
        el.lastSampJd=simJd;
      }
      const n=el.samp.length/3;
      if(n>=2){
        const pa=el.line.geometry.attributes.position.array, ca=el.line.geometry.attributes.color.array;
        const peak=sel?1.0:0.7;
        for(let i=0;i<n;i++){
          pa[i*3]=el.samp[i*3];pa[i*3+1]=el.samp[i*3+1];pa[i*3+2]=el.samp[i*3+2];
          const f=i/(n-1), a=f*f*peak;                 // newest = brightest, fades to 0
          ca[i*3]=tc.r*a;ca[i*3+1]=tc.g*a;ca[i*3+2]=tc.b*a;
        }
        el.line.geometry.attributes.position.needsUpdate=true;
        el.line.geometry.attributes.color.needsUpdate=true;
        el.line.geometry.setDrawRange(0,n);
      }else el.line.geometry.setDrawRange(0,0);
    }
    dotGeo.attributes.position.needsUpdate=true;dotGeo.attributes.color.needsUpdate=true;

    // selected: emphasised ring + bright connector to Earth (origin) + live distance
    if(selected&&!selected.hidden){
      astPos.copy(posAt(selected,simJd,AU)).sub(earthHelio);
      selRing.position.copy(astPos);selRing.quaternion.copy(camera.quaternion);
      selRing.material.opacity=0.9;selRing.scale.setScalar(1+0.09*Math.sin(now*0.005));
      const pa=link.geometry.attributes.position.array;
      pa[0]=astPos.x;pa[1]=astPos.y;pa[2]=astPos.z;pa[3]=0;pa[4]=0;pa[5]=0;
      link.geometry.attributes.position.needsUpdate=true;
      link.material.opacity=0.72+0.24*Math.sin(now*0.006);
      const distLd=astPos.length()/AU*AU_TO_LD;
      if($('card').classList.contains('show'))
        $('status').innerHTML=`<span class="hot">◉ FOLLOWING</span> ${selected.ref.short_name} · ${distLd.toFixed(1)} LD from Earth now`;
    }else{selRing.material.opacity*=0.9;link.material.opacity*=0.9;}

    // camera — Earth locked at origin; following only adjusts zoom to keep both
    // the asteroid and Earth framed together.
    camTarget.set(0,0,0);
    if(following&&selected&&!selected.hidden){
      desR=Math.max(3.0,Math.min(30,(astPos.length()*2.6+2.0)*zoomMul));
    }else desR=DEFAULT_R*zoomMul;
    actR+=(desR-actR)*0.1;
    updateCamera();

    // UI
    $('bigDate').innerHTML=fmtDate(simJd);
    const f=(simJd-START_JD)/(END_JD-START_JD);
    $('handle').style.left=(f*100)+'%';$('trackFill').style.width=(f*100)+'%';

    renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
