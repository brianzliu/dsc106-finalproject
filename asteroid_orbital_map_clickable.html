<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Near-Earth Asteroid Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060f; --panel:rgba(9,12,24,0.72); --panel-solid:rgba(7,9,19,0.96);
    --line:rgba(255,255,255,0.12); --line-soft:rgba(255,255,255,0.06);
    --ink:#f4f6fb; --dim:rgba(226,231,243,0.66); --faint:rgba(226,231,243,0.42);
    --amber:#ffc861; --cyan:#7fd8ff; --coral:#ff7a72;
    --shadow:0 18px 50px rgba(0,0,0,0.55);
    --serif:"Fraunces",Georgia,serif; --sans:"Hanken Grotesk",system-ui,sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--bg);font-family:var(--mono);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;}

  #loading{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;}
  #loading .title{font-family:var(--serif);font-size:32px;letter-spacing:0.02em;font-style:italic;}
  #loadBar{width:240px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
  #loadFill{height:100%;width:0%;background:var(--cyan);transition:width 0.35s ease;}
  #loadMsg{font-size:10.5px;color:var(--faint);letter-spacing:0.14em;text-transform:uppercase;}

  #app{position:fixed;inset:0;display:none;}
  canvas#c{display:block;width:100%;height:100%;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);}

  /* title — flush top-left */
  #title{position:absolute;top:24px;left:24px;font-family:var(--serif);font-weight:400;
    font-size:27px;line-height:1.05;letter-spacing:0.01em;pointer-events:none;
    opacity:0;animation:fade 0.9s 0.2s forwards;}
  #title em{font-style:italic;color:var(--cyan);}

  /* search / filter — flush top-right */
  #finder{position:absolute;top:24px;right:24px;width:330px;display:flex;flex-direction:column;gap:9px;
    opacity:0;animation:fade 0.9s 0.35s forwards;}
  #searchBox{display:flex;align-items:center;gap:9px;padding:9px 13px;}
  #searchBox svg{flex-shrink:0;opacity:0.5;}
  #search{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:var(--sans);font-size:14px;}
  #search::placeholder{color:var(--faint);}
  #results{max-height:240px;overflow-y:auto;padding:5px;display:none;}
  #results.show{display:block;}
  .res{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:11.5px;display:flex;justify-content:space-between;gap:10px;}
  .res:hover{background:rgba(255,255,255,0.06);}
  .res .nm{color:var(--ink);}
  .res .meta{color:var(--faint);font-size:11px;white-space:nowrap;}
  .res .meta.haz{color:var(--coral);}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chips::before{content:"Show";font-family:var(--sans);font-size:12px;color:var(--dim);width:100%;}
  .chip{font-family:var(--sans);font-size:12px;letter-spacing:0.01em;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,0.03);color:var(--faint);cursor:pointer;transition:all 0.18s;}
  .chip:hover{color:var(--ink);}
  .chip.on{color:var(--amber);border-color:var(--amber);background:rgba(255,200,97,0.1);}

  /* view buttons — flush, below finder */
  #viewBtns{position:absolute;top:118px;right:24px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;
    opacity:0;animation:fade 0.9s 0.45s forwards;}
  #viewBtns::before{content:"View";font-family:var(--sans);font-size:12px;color:var(--dim);align-self:flex-end;}
  .vbtn{font-family:var(--sans);font-size:12px;letter-spacing:0.01em;
    background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:7px 12px;cursor:pointer;
    transition:all 0.2s;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
  .vbtn:hover{border-color:var(--cyan);color:var(--ink);}
  .vbtn.on{border-color:var(--amber);color:var(--amber);}
  .zoomrow{display:flex;gap:8px;}
  .vbtn.zb{width:38px;text-align:center;font-size:15px;padding:5px 0;line-height:1;}

  /* selected-asteroid card — flush bottom-left */
  #card{position:absolute;left:24px;bottom:24px;width:330px;padding:18px 20px;z-index:72;
    max-height:calc(100vh - 48px);overflow-y:auto;
    transform:translateY(14px);opacity:0;pointer-events:none;transition:opacity 0.4s,transform 0.4s cubic-bezier(0.22,1,0.36,1);}
  #card::-webkit-scrollbar{width:0;}
  /* in scroll-driven (guided) mode the left edge belongs to the narrative rail,
     so the selected-asteroid card docks on the right instead. */
  body.guided #card{left:auto;right:24px;bottom:24px;}
  body.embedded #title{display:none!important;}
  #card.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  #card .nm{font-family:var(--serif);font-size:30px;line-height:1.05;margin-bottom:12px;padding-right:22px;}
  #card .badge{display:inline-block;font-family:var(--sans);font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:7px;vertical-align:middle;letter-spacing:0.06em;}
  #card .cls{display:none;}
  #card .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px;}
  #card .k{display:none;}
  #card .lbl{font-family:var(--sans);font-size:14px;line-height:1.2;color:var(--dim);margin-bottom:8px;}
  #card .metric svg{width:100%;height:62px;display:block;margin-bottom:8px;}
  #card .v{font-size:23px;line-height:1.12;color:var(--ink);} #card .v small{font-size:16px;color:var(--dim);}
  #card .metric{border:1px solid var(--line-soft);border-radius:11px;padding:12px;background:rgba(255,255,255,0.025);}
  #card .miss{grid-column:1/3;padding:13px;border:1px solid var(--line-soft);border-radius:11px;background:rgba(255,255,255,0.025);}
  #card .miss .v{font-size:29px;color:var(--coral);white-space:normal;} #card.safe .miss .v{color:var(--cyan);}
  #card .miss small{display:inline;font-size:18px;margin-left:8px;color:inherit;white-space:nowrap;}
  #card .miss .km{color:var(--dim);}
  #card .close{position:absolute;top:13px;right:14px;background:none;border:none;color:var(--faint);font-size:15px;cursor:pointer;line-height:1;}
  #card .close:hover{color:var(--ink);}
  /* per-asteroid closest-pass diagram */
  #card .threat{margin-top:15px;padding-top:13px;border-top:1px solid var(--line-soft);}
  #card .threat > .k{display:none;}
  #card .verdict{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;}
  #card .mini{border:1px solid var(--line-soft);border-radius:10px;padding:9px;background:rgba(255,255,255,0.025);}
  #card .mini .k{display:none;}
  #card .mini svg{width:100%;height:92px;display:block;}
  #card .mini .v2{font-size:18px;color:var(--ink);margin-top:8px;line-height:1.2;}

  /* time console — flush bottom-center */
  #console{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(720px,calc(100vw - 360px));
    min-width:380px;padding:15px 20px 16px;opacity:0;animation:fade 0.9s 0.5s forwards;}
  #ctop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:11px;}
  #bigDate{font-family:var(--serif);font-size:34px;line-height:0.95;letter-spacing:0.015em;}
  #bigDate .yr{color:var(--amber);}
  #status{display:none;}
  #status .hot{color:var(--cyan);}
  #rateVal{display:none;}
  #scrub{position:relative;height:30px;margin:2px 0 11px;cursor:pointer;}
  #track{position:absolute;left:0;right:0;top:13px;height:3px;background:rgba(255,255,255,0.1);border-radius:3px;}
  #trackFill{position:absolute;left:0;top:0;height:100%;background:var(--cyan);opacity:0.55;border-radius:3px;width:0;}
  #handle{position:absolute;top:7px;width:4px;height:15px;border-radius:3px;background:var(--ink);
    box-shadow:0 0 9px rgba(255,255,255,0.6);transform:translateX(-50%);pointer-events:none;}
  .yrlabel{position:absolute;top:21px;font-size:8px;color:var(--faint);transform:translateX(-50%);}
  #selTick{position:absolute;top:3px;width:2px;height:23px;border-radius:2px;background:var(--amber);
    box-shadow:0 0 10px var(--amber);transform:translateX(-50%);display:none;}
  #selTick::after{content:'closest';position:absolute;bottom:25px;left:50%;transform:translateX(-50%);
    font-size:8px;color:var(--amber);white-space:nowrap;}
  #transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tbtn{font-family:var(--mono);background:rgba(255,255,255,0.04);border:1px solid var(--line);
    color:var(--dim);border-radius:9px;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;}
  .tbtn:hover{border-color:var(--cyan);color:var(--ink);}
  .tbtn.icon{width:36px;height:32px;font-size:12px;}
  #playBtn{width:44px;height:32px;font-size:13px;background:rgba(111,211,255,0.08);color:var(--cyan);border-color:var(--line);}
  #playBtn:hover{background:rgba(111,211,255,0.16);}
  .tbtn.on{border-color:var(--amber);color:var(--amber);background:rgba(255,200,97,0.08);}
  .sep{width:1px;height:20px;background:var(--line-soft);margin:0 2px;}
  .speeds{display:flex;gap:5px;}
  .spd{font-size:9.5px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,0.03);color:var(--faint);cursor:pointer;transition:all 0.18s;}
  .spd:hover{color:var(--ink);} .spd.on{color:var(--amber);border-color:var(--amber);background:rgba(255,200,97,0.1);}
  body.embedded .speeds, body.embedded .sep, body.embedded #btnRev{display:none;}

  #tip{position:absolute;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line);
    border-radius:9px;padding:7px 11px;font-size:11px;display:none;max-width:200px;z-index:40;}
  #tip .s{color:var(--dim);font-size:10px;}
  body.guided #tip{display:none!important;}

  /* always-on floating label that tracks the focused asteroid in the scene */
  #astLabel{position:absolute;pointer-events:none;display:none;z-index:42;white-space:nowrap;
    transform:translate(-50%,-100%);padding:7px 13px;border-radius:30px;
    background:rgba(7,9,19,0.82);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-family:var(--mono);font-size:11.5px;letter-spacing:0.03em;box-shadow:0 8px 26px rgba(0,0,0,0.5);}
  #astLabel::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);
    background:rgba(7,9,19,0.82);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
  #astLabel .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:middle;
    background:var(--cyan);box-shadow:0 0 9px var(--cyan);}
  #astLabel .nm{color:var(--ink);font-weight:600;letter-spacing:0.05em;}
  #astLabel .ld{color:var(--cyan);}
  #astLabel.haz .pulse{background:var(--coral);box-shadow:0 0 9px var(--coral);}
  #astLabel.haz .ld{color:var(--coral);}
  #timeBadge{position:absolute;left:24px;bottom:24px;z-index:38;display:none;min-width:230px;
    padding:12px 15px;border-radius:12px;background:rgba(7,9,19,0.74);border:1px solid var(--line);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(0,0,0,0.45);}
  body.guided #timeBadge{display:block;}
  #timeBadge .date{font-family:var(--serif);font-size:26px;line-height:1;color:#fff;}
  #timeBadge .rate{display:none;}
  #timeBadge .bar{height:3px;border-radius:3px;background:rgba(255,255,255,0.12);margin-top:10px;overflow:hidden;}
  #timeBadge .bar i{display:block;height:100%;width:0;background:var(--cyan);border-radius:3px;}
  body.guided.timeline-on #timeBadge{display:none;}
  body.guided.timeline-on #console{left:24px;right:auto;bottom:24px;transform:none;width:min(420px,calc(100vw - 390px));
    min-width:320px;z-index:39;animation:none;opacity:1;}
  body.guided.timeline-on #card.show{display:block!important;right:24px;bottom:24px;z-index:72;}

  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  #title{transform:none;} /* let fade handle it */
  @media (max-width:760px){#card{display:none;}#finder{width:200px;}#console{min-width:300px;width:calc(100vw - 40px);}}
</style>
</head>
<body>

<div id="loading">
  <div class="title">Near-Earth Asteroid Survey</div>
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="loadMsg">Initializing…</div>
</div>

<div id="app">
  <canvas id="c"></canvas>

  <h1 id="title">Near-Earth <em>Asteroid</em> Survey</h1>

  <div id="finder">
    <div id="searchBox" class="panel">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" placeholder="Search by name, e.g. Apophis" autocomplete="off"/>
    </div>
    <div id="results" class="panel"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="viewBtns">
    <button class="vbtn" id="btnScale">Solar system</button>
    <button class="vbtn" id="btnTop">Top view</button>
    <button class="vbtn" id="btnReset">Reset view</button>
    <div class="zoomrow">
      <button class="vbtn zb" id="btnZoomOut" title="Zoom out">−</button>
      <button class="vbtn zb" id="btnZoomIn" title="Zoom in">+</button>
    </div>
  </div>

  <div id="card" class="panel"></div>

  <div id="console" class="panel">
    <div id="ctop">
      <div>
        <div id="bigDate">—</div>
        <div id="status"></div>
      </div>
      <div id="rateVal">1 mo / s</div>
    </div>
    <div id="scrub"><div id="track"><div id="trackFill"></div></div><div id="ticks"></div><div id="selTick"></div><div id="handle"></div></div>
    <div id="transport">
      <button class="tbtn" id="playBtn" title="Play / pause">▶</button>
      <button class="tbtn icon on" id="btnRev" title="Reverse">↺</button>
      <span class="sep"></span>
      <div class="speeds" id="speeds"></div>
    </div>
  </div>

  <div id="tip"></div>
  <div id="astLabel"><span class="pulse"></span><span class="nm"></span><span class="ld"></span></div>
  <div id="timeBadge"><div class="date" id="tbDate">—</div><div class="rate" id="tbRate">time moving</div><div class="bar"><i id="tbFill"></i></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const loadFill=$('loadFill'),loadMsg=$('loadMsg');
  const setLoad=(p,m)=>{loadFill.style.width=p+'%';if(m)loadMsg.textContent=m;};

  // ── DATA ──────────────────────────────────────────────────────────────────
  setLoad(12,'Fetching orbital data…');
  let astData,caData,CA_BY_NAME;
  try{
    const [a,c]=await Promise.all([fetch('data/asteroids.json'),fetch('data/close_approaches.json')]);
    setLoad(42,'Parsing…'); astData=await a.json(); caData=await c.json();
  }catch(err){ loadMsg.textContent='Load error: '+err.message; return; }
  CA_BY_NAME={};
  for(const ca of caData.close_approaches){ (CA_BY_NAME[ca.name]||(CA_BY_NAME[ca.name]=[])).push(ca); }

  // ── TIME / ORBIT MATH ───────────────────────────────────────────────────────
  const DEG=Math.PI/180, AU=2.6, AU_TO_LD=389.17;
  const jdFromMs=ms=>ms/86400000+2440587.5, msFromJd=jd=>(jd-2440587.5)*86400000;
  const jdFromDateStr=s=>jdFromMs(Date.parse(s+'T00:00:00Z'));
  const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const fmtDate=jd=>{const d=new Date(msFromJd(jd));return `${String(d.getUTCDate()).padStart(2,'0')} ${MON[d.getUTCMonth()]} <span class="yr">${d.getUTCFullYear()}</span>`;};
  const dateStrFromJd=jd=>{const d=new Date(msFromJd(jd));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;};
  const START_JD=jdFromDateStr('2025-01-01'), END_JD=jdFromDateStr('2125-01-01');

  function prep(el){
    const i=el.inc*DEG,Om=el.node*DEG,om=el.peri*DEG;
    const cO=Math.cos(Om),sO=Math.sin(Om),co=Math.cos(om),so=Math.sin(om),cI=Math.cos(i),sI=Math.sin(i);
    el.b=el.a*Math.sqrt(1-el.e*el.e); el.ae=el.a*el.e;
    el.m00=cO*co-sO*so*cI; el.m01=-cO*so-sO*co*cI;
    el.m20=sO*co+cO*so*cI; el.m21=-sO*so+cO*co*cI;
    el.m10=so*sI;          el.m11=co*sI;
    return el;
  }
  function solveE(M,e){
    M=((M%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    let E=e<0.8?M:Math.PI;
    for(let k=0;k<8;k++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-6)break;}
    return E;
  }
  const _v=new THREE.Vector3();
  function posAt(el,jd,s){
    const M=(el.M0+el.n*(jd-el.epoch))*DEG, E=solveE(M,el.e);
    const xo=el.a*Math.cos(E)-el.ae, yo=el.b*Math.sin(E);
    return _v.set((el.m00*xo+el.m01*yo)*s,(el.m10*xo+el.m11*yo)*s,(el.m20*xo+el.m21*yo)*s);
  }

  // Earth — mean elements at J2000
  const EARTH=prep({a:1.00000,e:0.01671,inc:0.00005,node:0.0,peri:102.9377,M0:357.529,n:0.985608,epoch:2451545.0});
  const J2000=2451545.0;
  const PLANETS=[
    {name:'MERCURY',col:0x9a8f80,el:prep({a:0.38710,e:0.20563,inc:7.005,node:48.331,peri:29.124,M0:174.795,n:4.092339,epoch:J2000})},
    {name:'VENUS',  col:0xc9b58e,el:prep({a:0.72333,e:0.00677,inc:3.395,node:76.680,peri:54.884,M0:50.115,n:1.602136,epoch:J2000})},
    {name:'MARS',   col:0xc66b4a,el:prep({a:1.52371,e:0.09339,inc:1.850,node:49.558,peri:286.502,M0:19.373,n:0.524039,epoch:J2000})},
  ];

  // ── SELECT THE NEAR-EARTH SET ───────────────────────────────────────────────
  // Asteroids with a 2025-2125 Earth approach, closest first; cap for a clean field.
  setLoad(60,'Selecting near-Earth objects…');
  const MAX_SHOWN=350;
  const AST=[];
  const FORCE=new Set(['Apophis','Ganymed','Florence','Phaethon','Bennu','Geographos','Cuno','Midas']);
  for(const a of astData.asteroids){
    if(a.epoch==null||a.mean_motion==null||a.mean_anomaly==null) continue;
    const cas=(CA_BY_NAME[a.short_name]||[]).filter(c=>c.year>=2025&&c.year<=2125);
    if(!cas.length) continue;
    let best=cas[0]; for(const c of cas) if(c.miss_distance_ld<best.miss_distance_ld) best=c;
    const el=prep({a:a.semi_major_axis,e:a.eccentricity,inc:a.inclination,node:a.ascending_node_longitude,
      peri:a.perihelion_argument,M0:a.mean_anomaly,n:a.mean_motion,epoch:a.epoch,
      ref:a,event:best,eventJd:jdFromDateStr(best.date),haz:!!a.potentially_hazardous});
    AST.push(el);
  }
  // Some comparison anchors, especially Ganymed, have orbital elements but no
  // tabulated 2025-2125 close-approach row in this dataset. Keep them focusable
  // by sampling their nearest geocentric pass in the display window.
  for(const a of astData.asteroids){
    if(!FORCE.has(a.short_name) || AST.some(el=>el.ref.short_name===a.short_name)) continue;
    if(a.epoch==null||a.mean_motion==null||a.mean_anomaly==null) continue;
    const el=prep({a:a.semi_major_axis,e:a.eccentricity,inc:a.inclination,node:a.ascending_node_longitude,
      peri:a.perihelion_argument,M0:a.mean_anomaly,n:a.mean_motion,epoch:a.epoch,ref:a,haz:!!a.potentially_hazardous});
    let bestJd=START_JD,bestLd=Infinity;
    for(let jd=START_JD;jd<=END_JD;jd+=10){

  // ── PICKING / ORBIT CONTROLS ─────────────────────────────────────────────────
  const ray=new THREE.Raycaster();

  const ndc=new THREE.Vector2();
  let dragging=false,lastX=0,lastY=0,moved=false;
  function pickDot(cx,cy){
    const r=canvas.getBoundingClientRect();
    ndc.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);
    const hits=ray.intersectObject(dots);

    if(lineHits.length){
      const hit=lineHits[0];
      const el=AST.find(el=>el.line===hit.object);
      if(el) return el;
    }
    return null;
  }
  let downOnCanvas=false;
  canvas.addEventListener('mousedown',e=>{dragging=true;downOnCanvas=true;lastX=e.clientX;lastY=e.clientY;moved=false;});
  addEventListener('mouseup',e=>{
    // only treat as a scene click if the press started on the canvas — clicking
    // UI (play/speed/etc.) must not deselect the followed asteroid.
    // In guided (scroll-driven) mode, picking still works but an empty click
    // never deselects, so the narrative's chosen focus is preserved.
    if(downOnCanvas&&!moved){const el=pickDot(e.clientX,e.clientY); if(el)selectAst(el,false); else if(!guided)deselect();}
    downOnCanvas=false;dragging=false;
  });
  addEventListener('mousemove',e=>{
    if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;
    if(Math.abs(dx)>2||Math.abs(dy)>2){moved=true;camManual();}
    theta-=dx*0.008;phi=Math.max(0.02,Math.min(Math.PI/2-0.02,phi-dy*0.008));
    lastX=e.clientX;lastY=e.clientY;
  });
  const EMBEDDED = window.parent !== window;   // true when hosted in the scrollytelling page
  if(EMBEDDED) document.body.classList.add('embedded');
  canvas.addEventListener('wheel',e=>{
    // When embedded, the wheel always belongs to the PAGE — forward it so the
    // narrative scrolls (both directions) and is never hijacked into zoom.
    // Zoom is done with the on-screen +/− buttons (and pinch/drag) instead.
    if(EMBEDDED){ try{parent.postMessage({scene:true,type:'wheel',dy:e.deltaY},'*');}catch(_){ } return; }
    e.preventDefault();camManual();zoomMul=Math.max(0.18,Math.min(5,zoomMul*(e.deltaY>0?1.1:0.909)));
  },{passive:true});

  let pinch=0,tMoved=false;
  canvas.addEventListener('touchstart',e=>{
    if(e.touches.length===1){dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;tMoved=false;}
    if(e.touches.length===2){pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();tMoved=true;camManual();
    if(e.touches.length===1&&dragging){const dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;
      theta-=dx*0.01;phi=Math.max(0.02,Math.min(Math.PI/2-0.02,phi-dy*0.01));lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
    if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(pinch>0)zoomMul=Math.max(0.18,Math.min(5,zoomMul*(pinch/d)));pinch=d;}
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    if(!tMoved&&e.changedTouches.length===1){const el=pickDot(e.changedTouches[0].clientX,e.changedTouches[0].clientY);if(el)selectAst(el,false);else if(!guided)deselect();}
    dragging=false;
  });

  const tip=$('tip');
  const astLabelEl=$('astLabel'), astLabelNm=astLabelEl.querySelector('.nm'), astLabelLd=astLabelEl.querySelector('.ld');
  const _proj=new THREE.Vector3();
  canvas.addEventListener('mousemove',e=>{
    if(guided){tip.style.display='none';return;}
    if(dragging){tip.style.display='none';return;}
    const el=pickDot(e.clientX,e.clientY);
    if(el){const dm=el.ref.diameter_max_m, dia=dm>=1000?(dm/1000).toFixed(1)+' km':Math.round(dm)+' m';
      tip.innerHTML=`<b>${el.ref.short_name}</b><br><span class="s">${dia} wide (${el.event.miss_distance_ld.toFixed(1)} LD miss)</span>`;
      tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-210)+'px';tip.style.top=(e.clientY-8)+'px';canvas.style.cursor='pointer';}
    else{tip.style.display='none';canvas.style.cursor='default';}
  });
  canvas.addEventListener('mouseleave',()=>tip.style.display='none');

  // scrubber
  const scrubEl=$('scrub');let scrubbing=false;
  function scrubTo(cx){const r=scrubEl.getBoundingClientRect();const f=Math.max(0,Math.min(1,(cx-r.left)/r.width));
    simJd=START_JD+f*(END_JD-START_JD);clearTrails();}
  scrubEl.addEventListener('mousedown',e=>{scrubbing=true;setPlaying(false);scrubTo(e.clientX);});
  addEventListener('mousemove',e=>{if(scrubbing)scrubTo(e.clientX);});
  addEventListener('mouseup',()=>scrubbing=false);
  scrubEl.addEventListener('touchstart',e=>{scrubbing=true;setPlaying(false);scrubTo(e.touches[0].clientX);},{passive:true});
  addEventListener('touchmove',e=>{if(scrubbing)scrubTo(e.touches[0].clientX);},{passive:true});
  addEventListener('touchend',()=>scrubbing=false);

  addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}
    // when embedded, forward up/down arrows so the narrative can step even while the
    // pointer/focus is over the 3-D scene (keyboard accessibility).
    else if(EMBEDDED&&(e.key==='ArrowDown'||e.key==='ArrowUp')){ e.preventDefault();
      try{parent.postMessage({scene:true,type:'nav',key:e.key},'*');}catch(_){ } }
  });

  // ════════════════════════════ MAIN LOOP (geocentric) ═══════════════════════
  // Everything is drawn in an Earth-centred frame: Earth is pinned at the origin
  // and never moves; each asteroid is positioned at (heliocentric − Earth), so
  // its trail traces its trajectory *relative to Earth*.
  const earthHelio=new THREE.Vector3(), astPos=new THREE.Vector3(), _sun=new THREE.Vector3(), _p=new THREE.Vector3();
  earthMesh.position.set(0,0,0); earthGlow.position.set(0,0,0); earthLabel.position.set(0,0.22,0);
  let last=performance.now();
  applyFilter();
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(0.05,(now-last)/1000);last=now;

    if(playing&&!scrubbing){
      simJd+=dir*SPEEDS[speedIdx].v*dt;
      if(simJd>=END_JD){simJd=END_JD;setPlaying(false);}
      if(simJd<=START_JD){simJd=START_JD;setPlaying(false);}
    }

    earthHelio.copy(posAt(EARTH,simJd,AU));   // frame origin (Earth's true position)
    earthMesh.rotation.y+=0.01;
    const advancing=playing&&!scrubbing;

    // scale context: shift the heliocentric solar system by −Earth so it sits
    // correctly around the fixed Earth at the origin.
    if(showScale){
      _sun.copy(earthHelio).multiplyScalar(-1);
      sunMarker.position.copy(_sun);sunGlow.position.copy(_sun);sunLabel.position.set(_sun.x,_sun.y+0.16,_sun.z);
      earthOrbit.position.copy(_sun);
      for(const p of planetVis){
        p.orbit.position.copy(_sun);
        _p.copy(posAt(p.el,simJd,AU)).sub(earthHelio);
        p.mesh.position.copy(_p);p.label.position.set(_p.x,_p.y+0.24,_p.z);
      }
    }

    // intro choreography: fade the swarm + rings in/out, and slide the camera's focus
    // between the Sun and Earth so the reveal feels progressive rather than abrupt.
    astAlpha += (astAlphaGoal-astAlpha)*0.05;
    ringsAlpha += (ringsAlphaGoal-ringsAlpha)*0.05;
    dots.material.opacity=0.95*astAlpha;
    dots.material.size=selected?0.22:0.12;
    earthRings.children.forEach(o=>{ o.material.opacity=(o.userData.base||0.2)*ringsAlpha; });
    earthRings.visible=ringsAlpha>0.01;
    if(targetMode==='sun') camTargetGoal.copy(earthHelio).multiplyScalar(-1);
    else camTargetGoal.set(0,0,0);

    for(const el of AST){
      const sel=(el===selected);
      // When an asteroid is selected, isolate it: hide every other asteroid so
      // only its trajectory relative to Earth is shown.
      if(el.hidden || (selected && !sel)){
        el.line.visible=false;el.line.geometry.setDrawRange(0,0);
        dotPos[el.idx*3]=dotPos[el.idx*3+1]=dotPos[el.idx*3+2]=99999;
        dotCol[el.idx*3]=dotCol[el.idx*3+1]=dotCol[el.idx*3+2]=0;
        continue;
      }
      // spotlight: when a chart highlights a subset, the rest fade right back.
      const spotOut = SPOT && !SPOT.has(el.ref.short_name);
      el.line.visible=!spotOut;
      astPos.copy(posAt(el,simJd,AU)).sub(earthHelio);   // Earth-relative position
      dotPos[el.idx*3]=astPos.x;dotPos[el.idx*3+1]=astPos.y;dotPos[el.idx*3+2]=astPos.z;
      // hazardous stays RED even when selected (a brightness boost used to wash it white);
      // a focused hazardous rock glows a vivid red, a focused safe rock glows bright white.
      let tc=el.haz?HAZ_TINT:WHITE, b;
      if(sel){ if(el.haz){ tc=SEL_HAZ; b=1.05; } else b=1.9; }
      else b=spotOut?0.14:(SPOT?1.5:1.0);
      dotCol[el.idx*3]=Math.min(1,tc.r*b);dotCol[el.idx*3+1]=Math.min(1,tc.g*b);dotCol[el.idx*3+2]=Math.min(1,tc.b*b);
      if(spotOut){ el.line.geometry.setDrawRange(0,0); continue; }   // dimmed: no trail

      if(advancing&&(el.lastSampJd===null||Math.abs(simJd-el.lastSampJd)>=TRAIL_MIN_STEP)){
        el.samp.push(astPos.x,astPos.y,astPos.z);
        if(el.samp.length>TRAIL_K*3)el.samp.splice(0,el.samp.length-TRAIL_K*3);
        el.lastSampJd=simJd;
      }
      const n=el.samp.length/3;
      if(n>=2){
        const pa=el.line.geometry.attributes.position.array, ca=el.line.geometry.attributes.color.array;
        const peak=sel?1.0:0.7;
        for(let i=0;i<n;i++){
          pa[i*3]=el.samp[i*3];pa[i*3+1]=el.samp[i*3+1];pa[i*3+2]=el.samp[i*3+2];
          const f=i/(n-1), a=f*f*peak;                 // newest = brightest, fades to 0
          ca[i*3]=tc.r*a;ca[i*3+1]=tc.g*a;ca[i*3+2]=tc.b*a;
        }
        el.line.geometry.attributes.position.needsUpdate=true;
        el.line.geometry.attributes.color.needsUpdate=true;
        el.line.geometry.setDrawRange(0,n);
      }else el.line.geometry.setDrawRange(0,0);
    }
    dotGeo.attributes.position.needsUpdate=true;dotGeo.attributes.color.needsUpdate=true;
    {const lo=0.9*Math.min(1,astAlpha); for(const el of AST) el.line.material.opacity=lo;}   // fade trails with the swarm during the intro

    // selected: emphasised ring + bright connector to Earth (origin) + live distance
    if(selected&&!selected.hidden){
      astPos.copy(posAt(selected,simJd,AU)).sub(earthHelio);
      selDist=astPos.length();                       // scene-units distance, for camera framing
      selRing.position.copy(astPos);selRing.quaternion.copy(camera.quaternion);
      // ring + connector match the asteroid's hazard colour (red when hazardous)
      selRing.material.color.set(selected.haz?0xff5a4d:0x6fd3ff);
      link.material.color.set(selected.haz?0xff7d72:0xffc861);
      // ring scaled by camera distance → stays a small, constant on-screen size at any zoom
      selRing.material.opacity=0.9;selRing.scale.setScalar(Math.max(0.02,actR*0.19)*(1+0.08*Math.sin(now*0.005)));
      const pa=link.geometry.attributes.position.array;
      pa[0]=astPos.x;pa[1]=astPos.y;pa[2]=astPos.z;pa[3]=0;pa[4]=0;pa[5]=0;
      link.geometry.attributes.position.needsUpdate=true;
      link.material.opacity=0.72+0.24*Math.sin(now*0.006);
      const distLd=astPos.length()/AU*AU_TO_LD;
      if($('card').classList.contains('show'))
        $('status').innerHTML=`${selected.ref.short_name} (${distLd.toFixed(1)} LD from Earth)`;
      // always-on floating label that tracks the asteroid on screen (replaces the old pill)
      _proj.copy(astPos).project(camera);
      if(_proj.z<1){
        astLabelEl.style.display='block';
        astLabelEl.classList.toggle('haz',!!selected.haz);
        astLabelEl.style.left=((_proj.x*0.5+0.5)*innerWidth)+'px';
        astLabelEl.style.top=((-_proj.y*0.5+0.5)*innerHeight - 16)+'px';
        astLabelNm.textContent=selected.ref.short_name;
        astLabelLd.textContent='  '+(distLd<1?distLd.toFixed(2):distLd.toFixed(1))+' LD from Earth';
      } else astLabelEl.style.display='none';
      // still emit a throttled tick for any external listeners
      if(now-lastTick>110){ lastTick=now;
        reply('tick',{name:selected.ref.short_name, distLd:+distLd.toFixed(2), haz:selected.haz}); }
    }else{selRing.material.opacity*=0.9;link.material.opacity*=0.9;astLabelEl.style.display='none';}

    // smooth camera tweening toward scroll-driven goals (manual input cancels it)
    if(camTween){
      if(!autoSpin) theta += (gTheta-theta)*0.06;
      phi     += (gPhi-phi)*0.06;
      zoomMul += (gZoom-zoomMul)*0.06;
    }
    if(autoSpin) theta += autoSpin*dt;

    // camera — Earth locked at origin; following only adjusts zoom to keep both
    // the asteroid and Earth framed together.
    if(following&&selected&&!selected.hidden){
      // frame Earth + the asteroid wherever it actually is, so a focused object is
      // never tiny or off-screen regardless of its real distance.
      camTarget.lerp(astPos.clone().multiplyScalar(0.36),0.08);
      desR=Math.max(6, selected._orbitR*0.6, selDist*1.65)*zoomMul;
    }else{
      camTarget.lerp(camTargetGoal,0.05);
      desR=DEFAULT_R*zoomMul;
    }
    actR+=(desR-actR)*0.1;
    updateCamera();

    // UI
    $('bigDate').innerHTML=fmtDate(simJd);
    const f=(simJd-START_JD)/(END_JD-START_JD);
    $('handle').style.left=(f*100)+'%';$('trackFill').style.width=(f*100)+'%';
    $('tbDate').innerHTML=fmtDate(simJd);
    $('tbRate').textContent=playing?'playing':'paused';
    $('tbFill').style.width=(f*100)+'%';

    renderer.render(scene,camera);
  }

  // ════════════════ EXTERNAL CONTROL API (scrollytelling driver) ═════════════
  // The parent page pins this scene as its centerpiece and drives it via
  // postMessage as the reader scrolls. Every command maps onto the same
  // functions the on-screen UI uses, so guided and free interaction share state.
  const CHROME=['title','finder','viewBtns','console'];
  function showChrome(v){
    CHROME.forEach(id=>{
      const e=$(id); if(!e) return;
      e.style.display=(v || (id==='console' && guidedTimeline))?'':'none';
    });
  }
  function setFilterKind(k){
    filter=k||'all';
    [...chipsEl.children].forEach(c=>c.classList.toggle('on',
      c.textContent.toLowerCase()===(filter==='all'?'all':filter.toLowerCase())));
    applyFilter(); renderResults($('search').value);
  }
  function preset(p){
    if(p==='overview'){ deselect(); camGoal({phi:0.16,theta:0,zoom:1.05,spin:0.04}); }
    else if(p==='top'){ camGoal({phi:0.05,theta:0,zoom:1,spin:0}); }
    else if(p==='closeup'){ camGoal({phi:0.46,zoom:0.82,spin:0}); }
    else if(p==='wide'){ camGoal({phi:0.22,theta:0.5,zoom:1.25,spin:0}); }
    else if(p==='free'){ camManual(); }
  }
  function reply(type,data){ try{ parent.postMessage(Object.assign({scene:true,type},data||{}),'*'); }catch(e){} }

  addEventListener('message',ev=>{
    const m=ev.data; if(!m||m.scene!==true||!m.type) return;   // only our own envelope
    switch(m.type){
      case 'guide':   guided=!!m.on; showChrome(!guided); document.body.classList.toggle('guided',guided); if(guided) tip.style.display='none'; break;
      case 'timeline': guidedTimeline=!!m.on; document.body.classList.toggle('timeline-on',guidedTimeline); showChrome(!guided); break;
      case 'focus': {
        const el=AST_BY_NAME[(m.name||'').toLowerCase()];
        if(el){ selectAst(el, m.jump!==false); if(m.preset) preset(m.preset); if(m.card===false) $('card').classList.remove('show'); else showCard(el); reply('focused',{name:el.ref.short_name}); }
        else reply('absent',{name:m.name});
        break; }
      case 'clearFocus': deselect(); break;
      case 'scale':     showScale=!!m.on; $('btnScale').classList.toggle('on',showScale); scaleObjs.forEach(o=>o.visible=showScale); break;
      case 'target':    targetMode=(m.to==='sun')?'sun':'earth'; break;
      case 'rings':     ringsAlphaGoal=m.on?1:0; break;
      case 'asteroids': astAlphaGoal=m.on?1:0; break;
      case 'filter':    setFilterKind(m.kind); break;
      case 'highlight': SPOT=(m.names&&m.names.length)?new Set(m.names):null; break;
      case 'camera':    preset(m.preset); break;
      case 'date':      simJd=jdFromDateStr(m.date); clearTrails(); setPlaying(false); break;
      case 'play':      setPlaying(!!m.on); break;
      case 'speed':     if(m.idx!=null){speedIdx=m.idx;[...speedsEl.children].forEach((c,j)=>c.classList.toggle('on',j===m.idx));updateRate();} break;
      case 'reset':     deselect(); setFilterKind('all'); preset('overview'); break;
    }
  });

  // Announce readiness (with the actual asteroid roster, so the parent can pick
  // representative objects that really exist in the scene) and flush queued commands.
  function sendReady(){ reply('ready',{list:AST.map(el=>({n:el.ref.short_name,h:el.haz?1:0,ld:el.event.miss_distance_ld}))}); }

  function applyUrlFocus(){
    const qs=new URLSearchParams(location.search);
    const name=qs.get('focus');
    if(!name) return;
    const el=AST_BY_NAME[name.toLowerCase()];
    if(!el) return;
    guided=qs.has('guided');
    guidedTimeline=qs.has('timeline');
    document.body.classList.toggle('guided',guided);
    document.body.classList.toggle('timeline-on',guidedTimeline);
    showChrome(!guided);
    selectAst(el, qs.get('jump')!=='false');
    preset(qs.get('preset')||'closeup');
    if(qs.get('play')!=='0') setPlaying(true);
  }
  sendReady();
  setTimeout(sendReady,300);   // belt-and-suspenders if parent bound late
  applyUrlFocus();

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
