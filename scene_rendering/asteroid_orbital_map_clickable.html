const AU=1.8;
const classColor={Apollo:0x4dabf7,Amor:0x69db7c,Aten:0xffd43b};
const classColorHex={Apollo:'#4dabf7',Amor:'#69db7c',Aten:'#ffd43b'};
const hazColor=0xff6b6b;

function keplerianToPoints(a,e,inc_deg,lonAscNode_deg,argPeri_deg,segments=128){
  const inc=inc_deg*Math.PI/180,Om=lonAscNode_deg*Math.PI/180,om=argPeri_deg*Math.PI/180;
  const b=a*Math.sqrt(1-e*e),c=a*e;
  const cosOm=Math.cos(Om),sinOm=Math.sin(Om),cosom=Math.cos(om),sinom=Math.sin(om),cosI=Math.cos(inc),sinI=Math.sin(inc);
  const pts=[];
  for(let i=0;i<=segments;i++){
    const E=(2*Math.PI*i)/segments;
    const xOrb=a*Math.cos(E)-c,yOrb=b*Math.sin(E);
    const x=(cosOm*cosom-sinOm*sinom*cosI)*xOrb+(-cosOm*sinom-sinOm*cosom*cosI)*yOrb;
    const z=(sinOm*cosom+cosOm*sinom*cosI)*xOrb+(-sinOm*sinom+cosOm*cosom*cosI)*yOrb;
    const y=(sinom*sinI)*xOrb+(cosom*sinI)*yOrb;
    pts.push(x,y,z);
  }
  return pts;
}

const canvas=document.getElementById('c');
const wrap=canvas.parentElement;

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});

}

// Starfield
(function(){

// Sun

scene.add(sunMesh);
[0.26,0.36].forEach((r,i)=>{
  const g=new THREE.RingGeometry(r,r+0.015,64);

// Planet orbits
const PLANETS=[
  {a:0.387,color:0xadb5bd,r:0.045},
  {a:0.723,color:0xe8b87a,r:0.06},
  {a:1.000,color:0x4dabf7,r:0.065},
  {a:1.524,color:0xe03131,r:0.055},
];
PLANETS.forEach(p=>{
  const pts=keplerianToPoints(p.a*AU,0,0,0,0,128);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  scene.add(new THREE.LineLoop(geo,new THREE.LineBasicMaterial({color:p.color,transparent:true,opacity:0.3})));
  const angle=Math.random()*Math.PI*2;
  const s=new THREE.Mesh(new THREE.SphereGeometry(p.r,16,16),new THREE.MeshBasicMaterial({color:p.color}));
  s.position.set(p.a*AU*Math.cos(angle),0,p.a*AU*Math.sin(angle));
  scene.add(s);
});

// Asteroids
const asteroidMeshes=[];
const orbitLines=[];
const haloMeshes=[];

ASTEROIDS.forEach((ast,i)=>{
  const baseColor=ast.potentially_hazardous?hazColor:(classColor[ast.orbit_class_type]||0xaaaaaa);
  const lonAscNode=(i*37.1)%360,argPeri=(i*61.3)%360;
  const pts=keplerianToPoints(ast.semi_major_axis*AU,ast.eccentricity,ast.inclination,lonAscNode,argPeri,128);

  // Orbit line
  let orbitLine=null;
  if(ast.semi_major_axis<5){
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
    const mat=new THREE.LineBasicMaterial({color:baseColor,transparent:true,opacity:ast.potentially_hazardous?0.45:0.22});
    orbitLine=new THREE.LineLoop(geo,mat);
    orbitLine.userData={baseColor,ast,index:i};
    scene.add(orbitLine);
  }
  orbitLines.push(orbitLine);

  // Dot
  const idx=Math.floor((i*53.7%128))*3;
  const px=pts[idx],py=pts[idx+1],pz=pts[idx+2];
  const dotR=ast.potentially_hazardous?0.055:0.038;
  const sphere=new THREE.Mesh(
    new THREE.SphereGeometry(dotR,10,10),
    new THREE.MeshBasicMaterial({color:baseColor})
  );
  sphere.position.set(px,py,pz);
  sphere.userData={ast,index:i,baseColor,dotR};
  scene.add(sphere);
  asteroidMeshes.push(sphere);

  // Halo
  let halo=null;
  if(ast.potentially_hazardous){
    halo=new THREE.Mesh(
      new THREE.SphereGeometry(dotR+0.03,10,10),
      new THREE.MeshBasicMaterial({color:0xff6b6b,transparent:true,opacity:0.18})
    );
    halo.position.copy(sphere.position);
    scene.add(halo);
  }
  haloMeshes.push(halo);
});

// ── SELECTION STATE ───────────────────────────────────────────────────────
let selectedIndex=-1;

function dimAll(){
  orbitLines.forEach((l,i)=>{
    if(!l)return;
    const ast=ASTEROIDS[i];
    l.material.opacity=ast.potentially_hazardous?0.08:0.05;
    l.material.color.setHex(l.userData.baseColor);
  });
  asteroidMeshes.forEach((m,i)=>{
    m.material.color.setHex(m.userData.baseColor);
    m.scale.setScalar(0.6);
  });
  haloMeshes.forEach(h=>{if(h)h.material.opacity=0.05;});
}

function resetAll(){
  orbitLines.forEach((l,i)=>{
    if(!l)return;
    const ast=ASTEROIDS[i];
    l.material.opacity=ast.potentially_hazardous?0.45:0.22;
    l.material.color.setHex(l.userData.baseColor);
  });
  asteroidMeshes.forEach(m=>{
    m.material.color.setHex(m.userData.baseColor);
    m.scale.setScalar(1);
  });
  haloMeshes.forEach(h=>{if(h)h.material.opacity=0.18;});
}

function selectAsteroid(idx){
  if(idx===selectedIndex){
    // deselect
    selectedIndex=-1;
    resetAll();
    closePanel();
    return;
  }
  selectedIndex=idx;
  isAutoRotating=false;
  document.getElementById('btnToggle').textContent='Resume rotation';

  dimAll();

  // Highlight selected orbit
  const ol=orbitLines[idx];
  if(ol){
    ol.material.opacity=1;
    ol.material.color.setHex(0xffffff);
  }
  // Highlight dot
  const mesh=asteroidMeshes[idx];
  mesh.material.color.setHex(0xffffff);
  mesh.scale.setScalar(2.2);
  const halo=haloMeshes[idx];
  if(halo)halo.material.opacity=0.35;

  openPanel(ASTEROIDS[idx]);
}

}

function barStat(label,value,max,color,display){
  const pct=Math.min(100,(value/max)*100);
  return `<div style="background:rgba(255,255,255,0.04);border-radius:8px;padding:10px 12px;border:0.5px solid rgba(255,255,255,0.08);">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
      <span style="font-size:10px;color:rgba(255,255,255,0.38);text-transform:uppercase;letter-spacing:0.07em;">${label}</span>
      <span style="font-size:13px;font-weight:600;color:#fff;">${display}</span>
    </div>
    <div style="height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;">
      <div style="height:100%;width:${pct}%;background:${color};border-radius:2px;transition:width 0.6s ease;"></div>
    </div>
  </div>`;
}

function openPanel(ast){
  const color=ast.potentially_hazardous?'#ff6b6b':(classColorHex[ast.orbit_class_type]||'#aaa');
  document.getElementById('pDot').style.background=color;
  document.getElementById('pName').textContent=ast.name;
  const badge=document.getElementById('pBadge');
  if(ast.potentially_hazardous){
    badge.textContent='⚠ Potentially hazardous';
    badge.style.cssText='font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;background:rgba(255,107,107,0.18);color:#ff6b6b;border:0.5px solid rgba(255,107,107,0.35);';
  } else {
    badge.textContent='✓ Non-hazardous';
    badge.style.cssText='font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;background:rgba(105,219,124,0.12);color:#69db7c;border:0.5px solid rgba(105,219,124,0.25);';
  }
  const classDesc={Apollo:'Earth-crossing orbit',Amor:'Earth-approaching, outside orbit',Aten:'Earth-interior orbit'};
  document.getElementById('pClass').textContent=`${ast.orbit_class_type} class · ${classDesc[ast.orbit_class_type]||'Near-Earth asteroid'}`;

  const dMin=ast.diameter_min_m>=1000?(ast.diameter_min_m/1000).toFixed(1)+' km':ast.diameter_min_m+' m';
  const dMax=ast.diameter_max_m>=1000?(ast.diameter_max_m/1000).toFixed(1)+' km':ast.diameter_max_m+' m';
  const dAvg=((ast.diameter_min_m+ast.diameter_max_m)/2);
  const dAvgStr=dAvg>=1000?(dAvg/1000).toFixed(2)+' km':(dAvg).toFixed(0)+' m';

  const yrs=(ast.orbital_period/365.25).toFixed(2);

  document.getElementById('pStats').innerHTML=
    statCard('Diameter (est.)',`${dMin} – ${dMax}`,'min / max estimate')+
    statCard('Orbital period',`${ast.orbital_period} days`,`${yrs} Earth years`)+
    statCard('Abs. magnitude',ast.magnitude,'brightness measure')+
    statCard('Avg diameter',dAvgStr,'midpoint estimate');

  const peri=ast.perihelion_distance?ast.perihelion_distance.toFixed(3):'—';
  const aphe=ast.aphelion_distance?ast.aphelion_distance.toFixed(3):'—';

  document.getElementById('pOrbit').innerHTML=
    barStat('Eccentricity',ast.eccentricity,1,color,ast.eccentricity.toFixed(4))+
    barStat('Inclination',ast.inclination,90,color,ast.inclination.toFixed(2)+'°')+
    barStat('Semi-major axis',ast.semi_major_axis,5,color,ast.semi_major_axis.toFixed(3)+' AU')+
    barStat('Perihelion',ast.perihelion_distance||0,5,color,peri+' AU')+
    barStat('Aphelion',ast.aphelion_distance||0,8,color,aphe+' AU')+
    barStat('Orbit class',['Apollo','Amor','Aten'].indexOf(ast.orbit_class_type)+1,3,color,ast.orbit_class_type);

  panel.style.transform='translateY(0)';
}

function closePanel(){
  panel.style.transform='translateY(100%)';
  selectedIndex=-1;
  resetAll();
}

document.getElementById('panelClose').addEventListener('click',closePanel);

// ── CAMERA CONTROLS ───────────────────────────────────────────────────────
let isAutoRotating=true;
let isDragging=false,lastX=0,lastY=0,didDrag=false;
let sphericalTheta=0.5,sphericalPhi=1.1,sphericalR=10;

function updateCamera(){
  camera.position.set(
    sphericalR*Math.sin(sphericalPhi)*Math.sin(sphericalTheta),
    sphericalR*Math.cos(sphericalPhi),
    sphericalR*Math.sin(sphericalPhi)*Math.cos(sphericalTheta)
  );
  camera.lookAt(0,0,0);
}

canvas.addEventListener('mousedown',e=>{isDragging=true;lastX=e.clientX;lastY=e.clientY;didDrag=false;});
window.addEventListener('mouseup',e=>{
  if(!didDrag){
    // it's a click — do raycast
    const rect=canvas.getBoundingClientRect();
    const mx=((e.clientX-rect.left)/rect.width)*2-1;
    const my=-((e.clientY-rect.top)/rect.height)*2+1;
    const ray=new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(mx,my),camera);
    const hits=ray.intersectObjects(asteroidMeshes);
    if(hits.length>0){
      selectAsteroid(hits[0].object.userData.index);
    }
  }
  isDragging=false;
});
window.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  if(Math.abs(dx)>2||Math.abs(dy)>2)didDrag=true;
  sphericalTheta-=dx*0.008;
  sphericalPhi=Math.max(0.1,Math.min(Math.PI-0.1,sphericalPhi+dy*0.008));
  lastX=e.clientX;lastY=e.clientY;
  updateCamera();
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  sphericalR=Math.max(3,Math.min(22,sphericalR+e.deltaY*0.02));
  updateCamera();
},{passive:false});

// Touch
let lastTouchDist=0,touchMoved=false;
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;touchMoved=false;}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lastTouchDist=Math.sqrt(dx*dx+dy*dy);}
});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  touchMoved=true;
  if(e.touches.length===1&&isDragging){
    const dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;
    sphericalTheta-=dx*0.01;sphericalPhi=Math.max(0.1,Math.min(Math.PI-0.1,sphericalPhi+dy*0.01));
    lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;updateCamera();
  }
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    sphericalR=Math.max(3,Math.min(22,sphericalR-(dist-lastTouchDist)*0.04));
    lastTouchDist=dist;updateCamera();
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(!touchMoved&&e.changedTouches.length===1){
    const rect=canvas.getBoundingClientRect();
    const mx=((e.changedTouches[0].clientX-rect.left)/rect.width)*2-1;
    const my=-((e.changedTouches[0].clientY-rect.top)/rect.height)*2+1;
    const ray=new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(mx,my),camera);
    const hits=ray.intersectObjects(asteroidMeshes);
    if(hits.length>0)selectAsteroid(hits[0].object.userData.index);
  }
  isDragging=false;
});

// ── HOVER TOOLTIP ─────────────────────────────────────────────────────────
const tip=document.getElementById('tip');
const mouse=new THREE.Vector2(-9,-9);
let hoverRay=new THREE.Raycaster();

canvas.addEventListener('mousemove',e=>{
  if(isDragging){tip.style.display='none';return;}
  const rect=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  hoverRay.setFromCamera(mouse,camera);
  const hits=hoverRay.intersectObjects(asteroidMeshes);
  if(hits.length>0){
    const ast=hits[0].object.userData.ast;
    tip.innerHTML=`<b style="color:#fff;display:block;margin-bottom:2px;">${ast.short_name}</b><span style="color:rgba(255,255,255,0.5);font-size:10px;">Click to inspect</span>`;
    tip.style.display='block';
    const tipX=e.clientX-wrap.getBoundingClientRect().left+14;
    const tipY=e.clientY-wrap.getBoundingClientRect().top-10;
    tip.style.left=Math.min(tipX,wrap.clientWidth-190)+'px';
    tip.style.top=Math.max(tipY,4)+'px';
    canvas.style.cursor='pointer';
  } else {
    tip.style.display='none';
    canvas.style.cursor='default';
  }
});
canvas.addEventListener('mouseleave',()=>tip.style.display='none');

// ── BUTTONS ───────────────────────────────────────────────────────────────
document.getElementById('btnReset').addEventListener('click',()=>{
  sphericalTheta=0.5;sphericalPhi=1.1;sphericalR=10;updateCamera();
  isAutoRotating=true;document.getElementById('btnToggle').textContent='Pause rotation';
  closePanel();
});
document.getElementById('btnToggle').addEventListener('click',function(){
  isAutoRotating=!isAutoRotating;
  this.textContent=isAutoRotating?'Pause rotation':'Resume rotation';
});

// ── RENDER ────────────────────────────────────────────────────────────────
updateCamera();
function animate(){
  requestAnimationFrame(animate);
  if(isAutoRotating){sphericalTheta+=0.002;updateCamera();}
  renderer.render(scene,camera);
}
animate();
})();
</script>
